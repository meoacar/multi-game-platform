;==============================================
; Takım Sistemi - Queue Worker Configuration
;==============================================
; Bu dosya /etc/supervisor/conf.d/ dizinine kopyalanmalı
; 
; Kurulum:
; sudo cp supervisor-queue-worker.conf /etc/supervisor/conf.d/takimsistemi-worker.conf
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl start takimsistemi-worker:*
;
; Komutlar:
; sudo supervisorctl status takimsistemi-worker:*
; sudo supervisorctl restart takimsistemi-worker:*
; sudo supervisorctl stop takimsistemi-worker:*
;==============================================

[program:takimsistemi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/takimsistemi/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/takimsistemi/storage/logs/worker.log
stopwaitsecs=3600
startsecs=0

; Environment variables
environment=
    APP_ENV="production",
    QUEUE_CONNECTION="redis"

; Process priority
priority=999

; Restart policy
startretries=3
exitcodes=0

; Log rotation
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

;==============================================
; High Priority Queue Worker (Opsiyonel)
;==============================================
; Yüksek öncelikli işler için ayrı worker

[program:takimsistemi-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/takimsistemi/artisan queue:work redis --queue=high --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/takimsistemi/storage/logs/worker-high.log
stopwaitsecs=3600
startsecs=0
priority=998

;==============================================
; Low Priority Queue Worker (Opsiyonel)
;==============================================
; Düşük öncelikli işler için ayrı worker

[program:takimsistemi-worker-low]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/takimsistemi/artisan queue:work redis --queue=low --sleep=5 --tries=2 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/takimsistemi/storage/logs/worker-low.log
stopwaitsecs=3600
startsecs=0
priority=1000

;==============================================
; Notlar:
;==============================================
; 
; numprocs: Worker sayısı (CPU core sayısına göre ayarla)
; max-time: Worker'ın maksimum çalışma süresi (saniye)
; max-jobs: Worker'ın işleyeceği maksimum job sayısı
; tries: Başarısız job'ların tekrar deneme sayısı
; sleep: Job'lar arası bekleme süresi (saniye)
; 
; Production için önerilen numprocs:
; - 2 CPU core: numprocs=2
; - 4 CPU core: numprocs=4
; - 8 CPU core: numprocs=6-8
;
; Queue Priority:
; high > default > low
;
; Monitoring:
; tail -f /var/www/takimsistemi/storage/logs/worker.log
; sudo supervisorctl tail -f takimsistemi-worker:takimsistemi-worker_00 stdout
;==============================================
